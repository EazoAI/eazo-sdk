name: Publish to NPM

on:
  push:
    tags:
      - '*'
      - 'v*'
      - 'V*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          VERSION=${VERSION#V}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: cd sdk && npm ci

      - name: Build
        run: cd sdk && npm run build

      - name: Run tests
        run: cd sdk && npm test

      - name: Update package version
        run: cd sdk && npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          case "$VERSION" in
            *-alpha*) DIST_TAG=alpha ;;
            *-beta*)  DIST_TAG=beta ;;
            *-rc*)    DIST_TAG=rc ;;
            *)        DIST_TAG=latest ;;
          esac
          echo "dist_tag=$DIST_TAG" >> $GITHUB_OUTPUT
          echo "Publishing $VERSION with dist-tag: $DIST_TAG"

      - name: Publish @eazo/sdk
        run: cd sdk && npm publish --access public --tag ${{ steps.dist_tag.outputs.dist_tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
