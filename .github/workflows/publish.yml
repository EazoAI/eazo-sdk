name: Publish to NPM

on:
  push:
    tags:
      - '*'
      - 'v*'
      - 'V*'

jobs:
  publish:
    runs-on: ubuntu-latest

    # OIDC (Trusted Publishing) 需要 id-token 权限来让 GitHub 签发 OIDC token
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          VERSION=${VERSION#V}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing (OIDC) 需要较新的 npm。setup-node 自带的 npm 可能过旧,显式升级。
      - name: Upgrade npm (for trusted publishing / OIDC)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: cd sdk && npm ci

      - name: Build
        run: cd sdk && npm run build

      - name: Run tests
        run: cd sdk && npm test

      - name: Update package version
        run: cd sdk && npm version ${{ steps.get_version.outputs.version }} --no-git-tag-version --allow-same-version

      - name: Publish @eazo/sdk
        # 使用 Trusted Publishing (OIDC),无需 NPM token。
        # 认证由 GitHub 签发的 OIDC token 自动完成。
        # 前提:已在 npmjs.com 的 @eazo/sdk 包设置里配置好本仓库为 trusted publisher。
        run: cd sdk && npm publish --access public
